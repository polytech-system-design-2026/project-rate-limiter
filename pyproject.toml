[project]
name = "project-rate-limiter"
version = "0.1.0"
description = "Проектирование цифровых продуктов: ограничитель трафика"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "redis>=5.0",
  "prometheus-client>=0.21",
  "python-json-logger>=3.2",
  "locust>=2.32",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "openapi-spec-validator>=0.7",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
]

[tool.uv]
package = false

# Курс читает эти поля: topic — тема шаблона, не меняйте;
# stage — текущий этап, поднимайте в начале каждого этапа (см. tasks/TASK-N.md).
# Допустимые значения stage: 1_architecture, 2_mvp, 3_scaling, 4_observability, 5_alerting.
[tool.course]
topic = "rate-limiter"
stage = "1_architecture"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: Depends(...) как дефолтный аргумент — официальный паттерн FastAPI,
# а не баг; без этого ruff ругался бы на каждый эндпоинт.
ignore = ["B008"]

[tool.ruff.lint.isort]
# Папка alembic/ с миграциями — не пакет проекта, а импорт библиотеки alembic.
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
pretty = true
explicit_package_bases = true
exclude = "contract_tests/"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
timeout = 30
