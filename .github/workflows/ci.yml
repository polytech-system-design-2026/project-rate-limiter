# ABOUTME: CI of the course project: lint, student tests, stage 1 docs checks, and contract tests
# ABOUTME: against the service in docker compose for every stage declared in pyproject.toml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.7"
  # Шаблон, из которого берутся эталонные тесты, и фиксированный тег.
  REFERENCE_REPO: polytech-system-design-2026/project-rate-limiter
  REFERENCE_TAG: reference-v1

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      stage_number: ${{ steps.stage.outputs.stage_number }}
    steps:
      - uses: actions/checkout@v7

      # Эталонная копия contract_tests/: правка своей копии не даёт эффекта.
      - name: checkout reference contract tests
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REFERENCE_REPO }}
          ref: ${{ env.REFERENCE_TAG }}
          path: .reference-template

      - name: sync reference contract tests
        run: |
          rm -rf contract_tests
          mv .reference-template/contract_tests contract_tests
          rm -rf .reference-template

      - name: read [tool.course].stage
        id: stage
        run: |
          number=$(python3 contract_tests/course.py stage-number)
          echo "Этап из pyproject.toml: $number"
          echo "stage_number=$number" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

  unit-tests:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --locked

      - name: pytest (ваши тесты)
        env:
          STAGE_NUMBER: ${{ needs.meta.outputs.stage_number }}
        run: |
          set +e
          uv run pytest tests -v
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            if [ "$STAGE_NUMBER" -ge 2 ]; then
              echo "В tests/ нет ни одного теста. С этапа 2 нужно не меньше 5 своих тестов на вашу логику (tasks/TASK-2.md)." >&2
              exit 1
            fi
            echo "Своих тестов пока нет — на этапе 1 это нормально."
            exit 0
          fi
          exit "$code"

  stage-1-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Эталонная копия contract_tests/: правка своей копии не даёт эффекта.
      - name: checkout reference contract tests
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REFERENCE_REPO }}
          ref: ${{ env.REFERENCE_TAG }}
          path: .reference-template

      - name: sync reference contract tests
        run: |
          rm -rf contract_tests
          mv .reference-template/contract_tests contract_tests
          rm -rf .reference-template

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --locked

      - name: pytest contract_tests/stage_1
        run: uv run python contract_tests/course.py test-stage-1 -v

  contract:
    needs: meta
    if: needs.meta.outputs.stage_number >= 2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Эталонная копия contract_tests/: правка своей копии не даёт эффекта.
      - name: checkout reference contract tests
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REFERENCE_REPO }}
          ref: ${{ env.REFERENCE_TAG }}
          path: .reference-template

      - name: sync reference contract tests
        run: |
          rm -rf contract_tests
          mv .reference-template/contract_tests contract_tests
          rm -rf .reference-template

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --locked

      - name: check docker-compose.yml exists
        run: |
          if [ ! -f docker-compose.yml ]; then
            echo "docker-compose.yml не найден в корне репозитория. На этапе 2 сервис поднимается через docker compose — см. tasks/TASK-2.md." >&2
            exit 1
          fi

      - name: promtool check rules
        if: needs.meta.outputs.stage_number >= 4
        run: |
          if [ ! -f observability/prometheus/rules.yml ]; then
            echo "Не найден observability/prometheus/rules.yml — правила алертов этапа 4, см. tasks/TASK-4.md." >&2
            exit 1
          fi
          docker run --rm -v "$PWD/observability/prometheus:/rules:ro" --entrypoint promtool \
            prom/prometheus:v3.13.2 check rules /rules/rules.yml

      - name: prepare .env
        run: cp .env.example .env

      - name: docker compose up
        run: docker compose up -d --build

      - name: wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "Сервис ответил на /health"
              exit 0
            fi
            sleep 2
          done
          echo "Сервис не ответил 200 на GET http://localhost:8000/health за 120 с. Причина — в шаге «docker compose logs» ниже: чаще всего приложение упало при старте или слушает 127.0.0.1 вместо 0.0.0.0." >&2
          exit 1

      - name: wait for observability services
        if: needs.meta.outputs.stage_number >= 4
        run: |
          wait_for() {
            for i in $(seq 1 60); do
              if curl -sf "$2" >/dev/null; then echo "$1 готов"; return 0; fi
              sleep 2
            done
            echo "$1 не ответил на $2 за 120 с. Смотрите docker compose logs ниже." >&2
            return 1
          }
          wait_for Prometheus http://localhost:9090/-/ready
          wait_for Loki http://localhost:3100/ready
          wait_for Grafana http://localhost:3000/api/health
          wait_for Alloy http://localhost:12345/-/ready

      - name: contract tests (этапы 2..N)
        run: uv run python contract_tests/course.py test-contract -v

      - name: docker compose logs
        if: always()
        run: test -f docker-compose.yml && docker compose logs --no-color || true

      - name: docker compose down
        if: always()
        run: test -f docker-compose.yml && docker compose down -v || true
